<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPU Escape</title><style>
*{box-sizing:border-box}body{margin:0;background:#080e1c;color:#eafaff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}main{width:min(1280px,100%)}header,footer{display:flex;justify-content:space-between;padding:18px 0;gap:15px}header{font-weight:900;letter-spacing:3px}span.accent{color:#60ffda}small,footer{color:#92abc1;font:12px monospace}#stage{position:relative;aspect-ratio:16/9;border:1px solid #315269;border-radius:12px;overflow:hidden;box-shadow:0 20px 80px #0008}canvas{width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;inset:22px 26px auto;display:flex;justify-content:space-between;pointer-events:none;font:13px monospace;color:#60ffda}#distance{text-align:right;font:bold 30px Arial;color:white}#best{display:block;font:12px monospace;color:#9fbace;margin-top:8px}.overlay{position:absolute;inset:0;background:#060d20eb;display:flex;align-items:center;justify-content:center;padding:24px}.overlay[hidden]{display:none}.panel{width:min(650px,100%);text-align:center}h1{font-size:clamp(22px,4vw,46px);margin:18px 0}p{color:#abc4d5;line-height:1.5}button{padding:15px 22px;border-radius:6px;border:1px solid #60ffda;background:#60ffda;color:#0b2332;font: bold 15px Arial;cursor:pointer}button:hover{filter:brightness(1.15)}button:focus-visible{outline:3px solid white;outline-offset:3px}#answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}#answers button{text-align:left;background:#183047;color:#eafaff;border-color:#3c6079;line-height:1.4}#answers button.correct{border-color:#60ffda;background:#174a43}#answers button.wrong{border-color:#ff668d;background:#522638}#eyebrow{font:12px monospace;letter-spacing:3px;color:#60ffda}#feedback{font-size:14px}@media(max-width:600px){body{padding:8px}#stage{aspect-ratio:4/5}header small{display:none}#hud{inset:15px}#answers button{font-size:12px;padding:10px}p{font-size:13px}footer{font-size:10px}}
</style></head><body><main><header><div>CPU<span class="accent">ESCAPE</span></div><small>CSC3501 / CIRCUIT RUNNER</small></header><div id="stage"><canvas id="game" aria-label="Obstacle runner: space, up arrow, or tap to jump"></canvas><div id="hud"><div>ENDLESS CIRCUIT<br><br><span id="speed">1.00× SPEED</span></div><div id="distance"><span id="score">0</span> m<small id="best">BEST 0 m</small></div></div><div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="title"><div class="panel"><div id="eyebrow">BOOT SEQUENCE / READY</div><h1 id="title">Escape the CPU.</h1><p id="description">Jump the spikes. Survive the circuit. Let your CPU knowledge save your run.</p><div id="answers"></div><p id="feedback" aria-live="polite"></p><button id="action">Start running →</button></div></div></div><footer><span>SPACE / ↑ / TAP · HOLD TO REPEAT JUMPS</span><span>P · PAUSE</span></footer></main><script src="questions.js"></script><script src="game.js"></script></body></html>
